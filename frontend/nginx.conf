server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de /api para o serviço `api` do docker-compose (Story 1.3 — a
    # primeira a precisar de chamadas reais do browser à API; Story 1.2
    # deixou isso deliberadamente de fora por não ter nenhum consumidor
    # ainda). `api` resolve via DNS interno do compose; a porta é a mesma
    # exposta pelo serviço (8080).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing (react-router-dom).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
