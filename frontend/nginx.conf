server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de /api para o serviço `api` do docker-compose (Story 1.3 — a
    # primeira a precisar de chamadas reais do browser à API; Story 1.2
    # deixou isso deliberadamente de fora por não ter nenhum consumidor
    # ainda). `api` resolve via DNS interno do compose; a porta é a mesma
    # exposta pelo serviço (8080).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Toda rota de negócio passou a viver sob `/e/{slug}/api/...` — Story 9.1
    # (Multi-Empresa), spec-9-1. O bloco `location /api/` acima continua
    # existindo só para `GET /api/health` (o liveness do compose/CI, a única
    # rota que ficou sem prefixo). Sem este bloco, uma chamada de API
    # prefixada cairia no `location /` e receberia o index.html do SPA.
    #
    # `proxy_pass` SEM barra final preserva o caminho original inteiro
    # (incluindo `/e/{slug}`), que é exatamente o que o mux do Go espera
    # receber para resolver a Empresa. O deep-link do SPA (`/e/{slug}/pedidos`,
    # por exemplo) NÃO casa esta regex e continua caindo no `try_files` do
    # bloco `/`.
    location ~ ^/e/[^/]+/api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets com hash no nome (Vite content-hashing, ex. index-D7EizV0e.js) —
    # o nome muda a cada build, então cachear "para sempre" nunca serve um
    # arquivo desatualizado; sem isso o navegador recai no heurístico padrão
    # (baseado em Last-Modified), que já causou o próprio bug que esta seção
    # corrige para index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA client-side routing (react-router-dom). index.html decide QUAL
    # bundle com hash carregar — precisa ser revalidado toda vez (no-cache
    # força um If-None-Match/If-Modified-Since, não impede o cache), senão
    # fechar e reabrir o navegador pode servir do disco uma versão antiga
    # apontando para JS/CSS que o deploy seguinte já removeu.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
