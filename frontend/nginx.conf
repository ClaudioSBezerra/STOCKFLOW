server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão de JSON (API), JS, CSS, SVG e texto. NÃO inclui
    # `text/event-stream`: o SSE (/realtime) precisa sair sem compressão para
    # não ser retido em buffer. `text/html` já é comprimido por padrão.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # Headers de segurança (21/10, migração de segurança) — nenhum estava
    # configurado antes. Aplica aqui no server (sem add_header próprio nas
    # locations de /api/, que então herdam normalmente), mas /assets/ e /
    # abaixo já têm Cache-Control próprio — um add_header dentro de um
    # location descarta TODOS os herdados de fora, então precisam da
    # duplicata explícita (testado com docker build + curl no FB_FAROL/
    # FB_SMARTPICK, mesmo bug).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Proxy de /api para o serviço `api` do docker-compose (Story 1.3 — a
    # primeira a precisar de chamadas reais do browser à API; Story 1.2
    # deixou isso deliberadamente de fora por não ter nenhum consumidor
    # ainda). `api` resolve via DNS interno do compose; a porta é a mesma
    # exposta pelo serviço (8080).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (tempo real): stream de longa duração. Sem buffering e sem gzip, com
    # Connection vazio (keep-alive HTTP/1.1 ao upstream) e read timeout alto,
    # para os eventos e os keep-alives chegarem ao navegador na hora. Precisa
    # vir ANTES do location genérico abaixo (a 1ª regex que casa vence).
    # Só existe a rota com slug (`/e/{slug}/api/realtime/*`) no backend.
    location ~ ^/e/[^/]+/api/realtime/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    # Toda rota de negócio passou a viver sob `/e/{slug}/api/...` — Story 9.1
    # (Multi-Empresa), spec-9-1. O bloco `location /api/` acima continua
    # existindo para as rotas sem prefixo: `GET /api/health` (o liveness do
    # compose/CI), a Plataforma (`/api/plataforma/*`) e as rotas da raiz do
    # domínio do Epic 15 (`/api/auth/entrar*`, `/api/auth/esqueci-senha` e
    # `GET /api/entrada`). Sem este bloco, uma chamada de API
    # prefixada cairia no `location /` e receberia o index.html do SPA.
    #
    # `proxy_pass` SEM barra final preserva o caminho original inteiro
    # (incluindo `/e/{slug}`), que é exatamente o que o mux do Go espera
    # receber para resolver a Empresa. O deep-link do SPA (`/e/{slug}/pedidos`,
    # por exemplo) NÃO casa esta regex e continua caindo no `try_files` do
    # bloco `/`.
    location ~ ^/e/[^/]+/api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets com hash no nome (Vite content-hashing, ex. index-D7EizV0e.js) —
    # o nome muda a cada build, então cachear "para sempre" nunca serve um
    # arquivo desatualizado; sem isso o navegador recai no heurístico padrão
    # (baseado em Last-Modified), que já causou o próprio bug que esta seção
    # corrige para index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # SPA client-side routing (react-router-dom). index.html decide QUAL
    # bundle com hash carregar — precisa ser revalidado toda vez (no-cache
    # força um If-None-Match/If-Modified-Since, não impede o cache), senão
    # fechar e reabrir o navegador pode servir do disco uma versão antiga
    # apontando para JS/CSS que o deploy seguinte já removeu.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.html;
    }
}
