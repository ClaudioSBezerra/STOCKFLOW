server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing (react-router-dom) — sem proxy de /api nesta
    # story (ver spec-1-2, Never: "Nginx do serviço web fazendo proxy de /api").
    location / {
        try_files $uri $uri/ /index.html;
    }
}
