name: Deploy to Cliente AWS (Ferreira Costa - suprimentos.fcxlabs.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres real para os testes de integracao (services/handlers/cmd):
    # sem DATABASE_URL eles dao t.Skip e o gate ficava verde mesmo com
    # regressao (achado do code review dos Epics 10-12, 2026-09-21).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://stockflow:stockflow@localhost:5432/stockflow?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: backend/go.sum

      # -p 1: todas as suites compartilham um unico banco (ver comentario em
      # backend/main_test.go) -- em paralelo elas se atropelam.
      - name: Run Go tests
        run: go test -p 1 ./...
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

  build-images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Extract metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-cliente-aws:
    needs: build-images
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, stockflow]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync docker-compose.yml para o deploy
        run: cp installer/cliente-aws/docker-compose.yml /opt/apps/stockflow/cliente-aws/docker-compose.yml

      - name: Pull latest images from GHCR
        working-directory: /opt/apps/stockflow/cliente-aws
        run: docker compose pull

      - name: Run migrations + restart containers
        working-directory: /opt/apps/stockflow/cliente-aws
        run: docker compose up -d --force-recreate

      - name: Health check
        run: |
          echo "Aguardando sistema iniciar..."
          WEB_PORT=$(grep '^WEB_PORT=' /opt/apps/stockflow/cliente-aws/.env | cut -d= -f2)
          WEB_PORT=${WEB_PORT:-3008}
          # `--max-time 5` em cada tentativa: sem isso, um /api/health que
          # trava (ex. db.PingContext sem timeout, backend/main.go, contra um
          # Postgres pendurado) prende esta chamada de curl indefinidamente,
          # e o loop nunca chega ao `exit 1` que despeja os logs da api --
          # incidente real 2026-09-18, descoberto so porque esta etapa ficou
          # presa por >15min sem nunca reportar falha.
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 "http://localhost:${WEB_PORT}/api/health" > /dev/null 2>&1; then
              echo "Deploy OK!"
              curl -s --max-time 5 "http://localhost:${WEB_PORT}/api/health"
              exit 0
            fi
            echo "Tentativa $i/20..."
            sleep 5
          done
          echo "Deploy falhou - health check nao respondeu."
          docker compose --project-directory /opt/apps/stockflow/cliente-aws ps
          docker compose --project-directory /opt/apps/stockflow/cliente-aws logs api --tail 50
          docker compose --project-directory /opt/apps/stockflow/cliente-aws logs db --tail 50
          exit 1

      - name: Seed do primeiro administrador
        working-directory: /opt/apps/stockflow/cliente-aws
        run: |
          # Le so as 3 linhas que interessam em vez de `source .env`: outros
          # valores do .env (ex. SMTP_FROM="Nome <email>") tem caracteres como
          # `<`/`>` que sao validos num arquivo KEY=VALUE mas quebram a sintaxe
          # se o arquivo inteiro for executado como script bash (incidente
          # real 2026-09-03: os dois deploys anteriores falharam aqui, com o
          # app ja no ar e saudavel -- so este passo quebrava depois).
          ADMIN_NOME=$(grep '^ADMIN_NOME=' .env | tail -1 | cut -d= -f2-)
          ADMIN_EMAIL=$(grep '^ADMIN_EMAIL=' .env | tail -1 | cut -d= -f2-)
          ADMIN_SENHA=$(grep '^ADMIN_SENHA=' .env | tail -1 | cut -d= -f2-)
          # ADMIN_EMPRESA_SLUG (Story 9.4): toda conta pertence a uma Empresa.
          # Desde a migration 000049 (Story 15.1) o banco recusa conta sem
          # Empresa e o seed-admin exige --empresa-slug; vazio NAO mantem mais
          # o comportamento antigo -- o seed do admin e pulado.
          ADMIN_EMPRESA_SLUG=$(grep '^ADMIN_EMPRESA_SLUG=' .env | tail -1 | cut -d= -f2-)
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_SENHA" ]; then
            echo "ADMIN_EMAIL/ADMIN_SENHA nao definidos no .env -- pulando seed do admin."
            exit 0
          fi
          # cmd/seed-admin (ver backend/cmd/seed-admin/main.go) e idempotente:
          # so cria a conta 'adm' se nenhuma existir ainda (indice unico
          # idx_usuarios_unico_adm). Roda em toda execucao do pipeline de
          # proposito -- e o mecanismo que garante que todo cliente novo ja
          # nasce com um administrador, sem passo manual.
          if [ -n "$ADMIN_EMPRESA_SLUG" ]; then
            docker compose exec -T api ./seed-admin --nome "$ADMIN_NOME" --email "$ADMIN_EMAIL" --senha "$ADMIN_SENHA" --empresa-slug "$ADMIN_EMPRESA_SLUG" || true
          else
            echo "::warning::ADMIN_EMPRESA_SLUG nao definido no .env -- pulando seed do admin."
          fi

      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deploy concluido com sucesso!"
            echo "Commit: ${{ github.sha }}"
            echo "URL: https://suprimentos.fcxlabs.com"
          else
            echo "Deploy falhou. Verifique os logs acima."
          fi

  # Diagnostico manual, so-leitura -- nao roda em push nenhum (so via
  # workflow_dispatch), nao depende dos jobs de deploy e nao reinicia nada.
  # Existe porque o time nao tem acesso SSH direto ao servidor no momento
  # (VPN isolada, 2026-09-18) -- este runner self-hosted, ja usado por
  # deploy-cliente-aws, e o unico canal disponivel para ver o estado real
  # da maquina. Cada comando tem timeout proprio para nunca travar como o
  # health check acima travou antes da correcao com --max-time.
  diagnostico:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, stockflow]
    timeout-minutes: 5

    steps:
      - name: Estado dos containers, logs e disco
        working-directory: /opt/apps/stockflow/cliente-aws
        run: |
          echo "=== docker compose ps ==="
          timeout 15 docker compose ps

          echo
          echo "=== espaco em disco ==="
          timeout 10 df -h

          echo
          echo "=== memoria ==="
          timeout 10 free -h

          echo
          echo "=== docker stats (snapshot, sem streaming) ==="
          timeout 15 docker stats --no-stream

          echo
          echo "=== logs: db (ultimas 100 linhas) ==="
          timeout 15 docker compose logs db --tail 100

          echo
          echo "=== logs: api (ultimas 100 linhas) ==="
          timeout 15 docker compose logs api --tail 100

          echo
          echo "=== logs: web (ultimas 50 linhas) ==="
          timeout 15 docker compose logs web --tail 50
