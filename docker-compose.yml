services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_DB: stockflow
    ports:
      - '5432:5432'
    volumes:
      - stockflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockflow -d stockflow']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable
      PORT: '8080'
      # Valor de desenvolvimento explícito (Story 1.4, AD-6) — nunca usado em
      # produção; cada ambiente real deve definir o próprio segredo.
      JWT_SECRET: dev-jwt-secret-nao-usar-em-producao
      # Diretório onde as fotos de Produto são gravadas em disco — nunca
      # base64 no banco (Story 3.5, AD-11/AD-13). Monta em cima do volume
      # nomeado `stockflow-fotos-data` abaixo, persistente entre `up`/`down`.
      FOTOS_DIR: /data/fotos
      # Login federado via Keycloak — SSO Ferreira Costa (Story 1.9, AD-7).
      # NÃO definido aqui de propósito: sem IAM_BASE_URL o SSO fica desligado e
      # este compose sobe idêntico ao comportamento atual. No ambiente de deploy
      # dedicado à Ferreira Costa, o operador define IAM_BASE_URL,
      # IAM_CLIENT_ID, IAM_REDIRECT_URI, IAM_ALLOWED_CLIENT_IDS (e, opcional,
      # IAM_SCOPES) — ver .env.example e spec-1-9 "operator_actions".
    ports:
      - '8080:8080'
    volumes:
      - stockflow-fotos-data:/data/fotos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
    ports:
      - '8081:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  stockflow-db-data:
  stockflow-fotos-data:
